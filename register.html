<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHT聊天室 - 注册</title>
    <style>
        body{background:#f0f4f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-size:18px;}
        .box{width:90%;max-width:420px;background:white;padding:30px;border-radius:12px;box-shadow:0 2px 12px #0000001c;}
        h1{text-align:center;margin-bottom:30px;color:#1a2535;font-size:26px;}
        input{width:100%;padding:14px;margin:10px 0;border:1px solid #bbb;border-radius:6px;font-size:17px;}
        .code-row{display:flex;gap:10px;}
        .code-row input{flex:1;}
        #getCodeBtn{white-space:nowrap;padding:14px;background:#444;color:white;border:none;border-radius:6px;margin-top:10px;}
        button{width:100%;padding:14px;background:#2563eb;color:white;border:none;border-radius:6px;margin-top:10px;font-size:18px;}
        .link{text-align:center;margin-top:18px;color:#2563eb;cursor:pointer;}
    </style>
</head>
<body>
<div class="box">
    <h1>ZHT聊天室</h1>
    <input id="nick" placeholder="昵称">
    <input id="email" placeholder="邮箱">
    <div class="code-row">
        <input id="code" placeholder="6位验证码">
        <button id="getCodeBtn" onclick="sendVerifyCode()">获取验证码</button>
    </div>
    <input id="pwd" type="password" placeholder="设置密码">
    <button onclick="reg()">注册</button>
    <div class="link" onclick="location.href='login.html'">已有账号？去登录</div>
</div>
<script>
    let countdown = 0;
    const codeBtn = document.getElementById("getCodeBtn");
    async function sendVerifyCode(){
        if(countdown>0)return;
        let email = document.getElementById("email").value.trim();
        if(!email){
            alert("请先填写邮箱");
            return;
        }
        let res = await fetch("/api/sendcode",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email:email})
        });
        let data = await res.json();
        alert(data.msg);
        if(data.success){
            countdown=60;
            let timer = setInterval(()=>{
                countdown--;
                codeBtn.innerText = `${countdown}s`;
                if(countdown<=0){
                    clearInterval(timer);
                    codeBtn.innerText="获取验证码";
                }
            },1000)
        }
    }
    async function reg(){
        let nickname = document.getElementById("nick").value;
        let email = document.getElementById("email").value;
        let password = document.getElementById("pwd").value;
        let code = document.getElementById("code").value;
        let res = await fetch("/api/register",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email,password,nickname,code})
        });
        let data = await res.json();
        if(data.success){
            alert(`注册成功！你的账号ID：${data.zhtid}`);
            location.href="index.html";
        }else{
            alert(data.msg);
        }
    }
</script>
</body>
</html>
