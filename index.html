<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        .container{display:flex;height:100vh}
        .sidebar{width:260px;background:#1e293b;color:white;padding:16px;overflow-y:auto}
        .main{flex:1;display:flex;flex-direction:column}
        .userinfo{padding-bottom:16px;border-bottom:1px solid #475569;margin-bottom:16px}
        .menu-item{padding:12px 10px;border-radius:6px;cursor:pointer;margin:4px 0}
        .menu-item:hover{background:#334155}
        .chat-area{flex:1;padding:16px;overflow-y:auto;background:#f8fafc}
        .input-bar{display:flex;padding:12px;border-top:1px solid #ddd}
        #msgInput{flex:1;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:6px;margin-right:8px}
        #sendBtn{padding:10px 20px;background:#2563eb;color:white;border:none;border-radius:6px;cursor:pointer}
        .msg{margin:6px 0;padding:8px 12px;background:#e2e8f0;border-radius:8px;max-width:70%}
    </style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div class="userinfo">
            <h3 id="nickname"></h3>
            <div id="zhtid"></div>
        </div>
        <div class="menu-item">💬 公共聊天室</div>
        <div class="menu-item">👥 好友列表</div>
        <div class="menu-item" onclick="logout()">🚪 退出登录</div>
    </div>
    <div class="main">
        <div class="chat-area" id="chatBox"></div>
        <div class="input-bar">
            <input id="msgInput" placeholder="输入消息...">
            <button id="sendBtn">发送</button>
        </div>
    </div>
</div>
<script>
let user = JSON.parse(localStorage.getItem('user'));
if(!user){location.href='login.html'}
document.getElementById('nickname').innerText = user.nickname;
document.getElementById('zhtid').innerText = user.zhtid;

const wsUrl = (window.location.protocol==='https:'?'wss://':'ws://')+window.location.host;
const ws = new WebSocket(wsUrl);
const chatBox = document.getElementById('chatBox');
const msgInput = document.getElementById('msgInput');

ws.onmessage = (e)=>{
    const div = document.createElement('div');
    div.className='msg';
    div.innerText = e.data;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
};
document.getElementById('sendBtn').onclick = sendMsg;
msgInput.onkeydown = e=>{if(e.key==='Enter')sendMsg()};
function sendMsg(){
    const text = msgInput.value.trim();
    if(!text)return;
    ws.send(`${user.nickname}(${user.zhtid})：${text}`);
    msgInput.value='';
}
function logout(){
    localStorage.removeItem('user');
    location.href='login.html';
}
</script>
</body>
</html>
