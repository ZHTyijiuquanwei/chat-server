<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHT聊天室 - 登录</title>
    <style>
        body{background:#f0f4f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-size:18px;}
        .box{width:90%;max-width:420px;background:white;padding:30px;border-radius:12px;box-shadow:0 2px 12px #0000001c;}
        h1{text-align:center;margin-bottom:30px;color:#1a2535;font-size:26px;}
        input{width:100%;padding:14px;margin:10px 0;border:1px solid #bbb;border-radius:6px;font-size:17px;}
        button{width:100%;padding:14px;background:#2563eb;color:white;border:none;border-radius:6px;margin-top:10px;font-size:18px;}
        .link{text-align:center;margin-top:18px;color:#2563eb;cursor:pointer;}
    </style>
</head>
<body>
<div class="box">
    <h1>ZHT聊天室</h1>
    <input id="email" placeholder="邮箱">
    <input id="pwd" type="password" placeholder="密码">
    <button onclick="login()">登录</button>
    <div class="link" onclick="location.href='register.html'">没有账号？去注册</div>
</div>
<script>
    async function login(){
        let email = document.getElementById("email").value;
        let pass = document.getElementById("pwd").value;
        let res = await fetch("/api/login",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({email:email,password:pass})
        });
        let data = await res.json();
        if(data.success){
            localStorage.setItem("chatUser",JSON.stringify(data.user));
            location.href="index.html";
        }else{
            alert(data.msg);
        }
    }
</script>
</body>
</html>
