<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZHT聊天室</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{display:flex;height:100vh;overflow:hidden;}
        .hamburger{display:none;font-size:28px;padding:12px;cursor:pointer;}
        .sidebar{width:260px;background:#1e293b;color:white;display:flex;flex-direction:column;transition:0.3s;z-index:99;}
        .sidebar h2{padding:16px;text-align:center;border-bottom:1px solid #334155;}
        .user-info{padding:14px;border-bottom:1px solid #334155;font-size:15px;}
        .close-side{display:none;text-align:right;padding:10px;font-size:24px;cursor:pointer;}
        .main{flex:1;display:flex;flex-direction:column;}
        .chat-area{flex:1;padding:16px;overflow-y:auto;background:#f8fafc;}
        .msg{margin:8px 0;padding:10px;border-radius:8px;max-width:75%;word-wrap:break-word;}
        .msg-self{background:#2563eb;color:white;margin-left:auto;}
        .msg-other{background:#e2e8f0;color:#111;}
        .input-bar{display:flex;padding:12px;border-top:1px solid #ddd;gap:8px;}
        #msgInput{flex:1;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px;}
        #sendBtn{padding:12px 20px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer;}

        @media(max-width:768px){
            .hamburger{display:block;background:#1e293b;color:white;}
            .sidebar{position:fixed;height:100vh;left:-260px;top:0;}
            .sidebar.open{left:0;}
            .close-side{display:block;}
        }
    </style>
</head>
<body>
    <div class="hamburger" onclick="openSide()">☰</div>
    <div class="sidebar" id="sideBar">
        <div class="close-side" onclick="closeSide()">✕</div>
        <h2>聊天室</h2>
        <div class="user-info" id="userBox"></div>
    </div>
    <div class="main">
        <div class="chat-area" id="chatBox"></div>
        <div class="input-bar">
            <input type="text" id="msgInput" placeholder="输入消息">
            <button id="sendBtn">发送</button>
        </div>
    </div>

<script>
let ws;
let user;
window.onload=function(){
    user=JSON.parse(localStorage.getItem("chatUser"));
    if(!user){
        location.href="login.html";
        return;
    }
    document.getElementById("userBox").innerText=`昵称：${user.nickname}\nID：${user.zhtid}`;
    connectWs();
}

function connectWs(){
    const protocol=location.protocol==="https:"?"wss://":"ws://";
    ws=new WebSocket(protocol+location.host);
    ws.onmessage=e=>{
        const data=JSON.parse(e.data);
        addMessage(data.nick,data.text,data.zhtid===user.zhtid);
    }
}

function addMessage(name,text,isSelf){
    const div=document.createElement("div");
    div.className="msg "+(isSelf?"msg-self":"msg-other");
    div.innerHTML=`<strong>${name}</strong><br>${text}`;
    document.getElementById("chatBox").appendChild(div);
    document.getElementById("chatBox").scrollTop=document.getElementById("chatBox").scrollHeight;
}

document.getElementById("sendBtn").onclick=sendMsg;
document.getElementById("msgInput").addEventListener("keydown",e=>{
    if(e.key==="Enter")sendMsg();
})

function sendMsg(){
    const text=document.getElementById("msgInput").value.trim();
    if(!text)return;
    ws.send(JSON.stringify({nick:user.nickname,zhtid:user.zhtid,text:text}));
    document.getElementById("msgInput").value="";
}

function openSide(){document.getElementById("sideBar").classList.add("open");}
function closeSide(){document.getElementById("sideBar").classList.remove("open");}
</script>
</body>
</html>
