<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #1a202c;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e2e8f0;
        }
        /* 顶部标题栏 */
        .header {
            padding: 16px 20px;
            background-color: #2d3748;
            border-bottom: 1px solid #4a5568;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 18px;
            color: #4fd1c5;
        }
        /* 消息区域 */
        .chat-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.other {
            background-color: #2d3748;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.me {
            background-color: #38b2ac;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }
        /* 底部输入区 */
        .input-area {
            padding: 12px 16px;
            background-color: #2d3748;
            border-top: 1px solid #4a5568;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            padding: 12px 14px;
            border: none;
            border-radius: 20px;
            background-color: #4a5568;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .input-area input:focus {
            outline: 2px solid #4fd1c5;
        }
        .input-area button {
            padding: 12px 18px;
            border: none;
            border-radius: 20px;
            background-color: #38b2ac;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .input-area button:active {
            background-color: #319795;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💬 公共聊天室</h1>
        <span style="font-size:13px;opacity:0.8">在线</span>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="message other">
            <div>欢迎来到聊天室！</div>
            <div class="msg-time">20:00</div>
        </div>
        <div class="message me">
            <div>我进来啦</div>
            <div class="msg-time">20:01</div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="输入消息...">
        <button onclick="sendMsg()">发送</button>
    </div>

    <script>
        // 本地演示发送功能
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            const chatArea = document.getElementById('chatArea');
            const now = new Date();
            const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message me';
            msgDiv.innerHTML = `<div>${text}</div><div class="msg-time">${time}</div>`;
            chatArea.appendChild(msgDiv);
            
            input.value = '';
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // 回车发送
        document.getElementById('msgInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
