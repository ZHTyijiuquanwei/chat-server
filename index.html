<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬公共聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background-color: #1a202c;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #e2e8f0;
        }
        .header {
            padding: 16px 20px;
            background-color: #2d3748;
            border-bottom: 1px solid #4a5568;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 18px;
            color: #4fd1c5;
        }
        .chat-area {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.other {
            background-color: #2d3748;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.me {
            background-color: #38b2ac;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.system{
            background:#44337a;
            align-self:center;
            max-width:95%;
            text-align:center;
            font-size:13px;
            opacity:0.8;
        }
        .msg-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }
        .input-area {
            padding: 12px 16px;
            background-color: #2d3748;
            border-top: 1px solid #4a5568;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-area input {
            flex: 1;
            padding: 12px 14px;
            border: none;
            border-radius: 20px;
            background-color: #4a5568;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .input-area button {
            padding: 12px 18px;
            border: none;
            border-radius: 20px;
            background-color: #38b2ac;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💬公共聊天室</h1>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="输入消息...">
        <button onclick="sendMsg()">发送</button>
    </div>

    <script>
        //连接WebSocket实时聊天服务器
        const wsUrl = "wss://"+window.location.host;
        const socket=new WebSocket(wsUrl);
        const myName="用户"+Math.floor(Math.random()*9999);

        socket.onmessage=function(event){
            let data=JSON.parse(event.data);
            const chatArea=document.getElementById("chatArea");
            const div=document.createElement("div");
            if(data.type==="system"){
                div.className="message system";
                div.innerText=data.text;
            }else{
                div.className="message other";
                div.innerHTML=`<div>${data.username}: ${data.text}</div><div class="msg-time">${data.time}</div>`;
            }
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function sendMsg(){
            let text=document.getElementById("msgInput").value.trim();
            if(!text) return;
            socket.send(JSON.stringify({name:myName,msg:text}));
            //自己画面立刻显示消息
            const chatArea=document.getElementById("chatArea");
            const div=document.createElement("div");
            div.className="message me";
            div.innerHTML=`<div>${text}</div><div class="msg-time">${new Date().toLocaleTimeString()}</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            document.getElementById("msgInput").value="";
        }
        document.getElementById('msgInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
